<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Family Finance Super App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Penguncian dimensi PWA iOS - Mutlak Anti-Zoom & Anti-Geser Diagonal */
        html, body {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
            -webkit-overflow-scrolling: auto;
        }

        /* Pure Dark Glassmorphism Theme 2026 */
        .glass-card {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Variasi Rona Gradasi Kaca Berdasarkan Karakter Master Pos */
        .card-blue   { background: rgba(30, 58, 138, 0.35); border-left: 6px solid #3b82f6; }
        .card-green  { background: rgba(19, 78, 74, 0.35);  border-left: 6px solid #14b8a6; }
        .card-purple { background: rgba(88, 28, 135, 0.35); border-left: 6px solid #a855f7; }
        .card-amber  { background: rgba(120, 53, 4, 0.35);  border-left: 6px solid #f59e0b; }
        .card-teal   { background: rgba(20, 83, 45, 0.35);  border-left: 6px solid #22c55e; }

        /* Tombol Aksi Melayang Tambah Transaksi `+` Kaca Transparan Premium */
        .glass-fab {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
        }

        /* Dock Navigasi Bawah Kaca Tempa Gelap */
        .glass-nav {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animasi Transisi Mikro Pudar Buku Besar Saat Geser Pos */
        .fade-in-ledger {
            animation: fadeInSimple 0.25s ease-out forwards;
        }
        @keyframes fadeInSimple {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes orbit {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(25px, -25px) scale(1.05); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-bg-glow { animation: orbit 14s infinite alternate ease-in-out; }
    </style>
</head>
<body class="dark bg-slate-950 text-slate-100 font-sans antialiased select-none flex justify-center items-center w-full h-full">

    <div class="absolute top-[-10%] left-[-10%] w-[100vw] h-[100vw] bg-indigo-900/25 rounded-full filter blur-[120px] animate-bg-glow z-0"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[90vw] h-[90vw] bg-emerald-900/15 rounded-full filter blur-[120px] animate-bg-glow z-0" style="animation-delay: 3s;"></div>

    <div class="relative z-10 w-full max-w-md h-full flex flex-col justify-between p-4 pt-5 pb-24 box-border overflow-hidden">
        
        <div id="loginScreen" class="w-full my-auto space-y-6">
            <div class="glass-card rounded-3xl p-6 text-center space-y-6">
                <div class="space-y-2">
                    <div class="inline-flex p-3.5 bg-white text-slate-950 font-black text-xl tracking-wider rounded-2xl shadow-sm">FF</div>
                    <h1 class="text-2xl font-black tracking-tight text-white">Family Finance</h1>
                    <p class="text-xs text-slate-400 font-bold">Platform FinTech Kolaborasi Keluarga</p>
                </div>

                <form id="formLogin" class="space-y-4 text-left">
                    <div class="space-y-1">
                        <label class="text-[10px] font-extrabold text-slate-500 uppercase tracking-widest pl-1">Username</label>
                        <input type="text" id="loginUsername" class="w-full bg-slate-900/50 rounded-2xl border border-slate-800 p-3.5 text-sm font-bold text-white focus:outline-none focus:border-indigo-500 transition" placeholder="Username Anda" required autocomplete="username">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-extrabold text-slate-500 uppercase tracking-widest pl-1">Password</label>
                        <input type="password" id="loginPassword" class="w-full bg-slate-900/50 rounded-2xl border border-slate-800 p-3.5 text-sm font-bold text-white focus:outline-none focus:border-indigo-500 transition" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="w-full bg-white text-slate-950 font-black rounded-2xl text-sm py-4 shadow-lg active:scale-[0.97] transition-all duration-150 mt-2 cursor-pointer">
                        Masuk Aplikasi
                    </button>
                </form>
            </div>
        </div>

        <div id="mainDashboard" class="w-full flex flex-col space-y-4 h-full overflow-hidden hidden">
            
            <div class="flex justify-between items-center glass-card rounded-2xl p-3 shrink-0">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-full bg-white text-slate-950 font-black text-sm flex items-center justify-center shadow-sm" id="userAvatar">U</div>
                    <div>
                        <h2 class="text-xs font-black tracking-tight text-white" id="userGreeting">Halo</h2>
                        <span class="text-[9px] bg-indigo-950/60 text-indigo-300 font-extrabold px-2 py-0.5 rounded-md uppercase tracking-wider block mt-0.5 w-max" id="userRole">Parent</span>
                    </div>
                </div>
                <button onclick="logout()" class="p-2.5 text-rose-400 hover:text-rose-500 hover:bg-rose-950/30 rounded-xl transition-all duration-200 cursor-pointer flex items-center justify-center" title="Keluar Aplikasi">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                </button>
            </div>

            <div class="bg-gradient-to-br from-slate-950 via-indigo-950 to-blue-950 text-white rounded-3xl p-4 shadow-xl shrink-0 space-y-2 relative overflow-hidden border border-white/5">
                <div class="flex items-center justify-between">
                    <p class="text-[9px] text-indigo-300 uppercase font-black tracking-widest flex items-center gap-1">
                        💳 Total Saldo Gabungan Keluarga
                    </p>
                    <button onclick="togglePrivacy()" class="text-indigo-300 hover:text-white transition text-xs cursor-pointer p-1">
                        <span id="eyeIcon">👁️</span>
                    </button>
                </div>
                <h3 class="text-2xl font-black tracking-tight text-white" id="txtSisaUang">Rp 0</h3>
                <p class="text-[10px] text-slate-300 bg-white/5 border border-white/5 p-2 rounded-xl font-medium" id="txtRekomendasi">Sistem siap.</p>
            </div>

            <div class="shrink-0 space-y-1.5 relative">
                <h4 class="text-[10px] font-extrabold text-slate-500 uppercase tracking-widest pl-1">Pilih Pos Keuangan (Geser Vertikal)</h4>
                
                <div class="relative w-full h-32 flex items-center">
                    <div class="w-full h-32 overflow-y-auto snap-y snap-mandatory no-scrollbar space-y-2.5 z-10" id="posCarousel" onscroll="handleVerticalScroll()">
                        </div>
                    
                    <div class="absolute right-[-14px] top-0 bottom-0 flex flex-col space-y-1.5 justify-center items-center w-3 z-20" id="carouselDots">
                        </div>
                </div>
            </div>

            <div class="flex-1 flex flex-col space-y-1.5 overflow-hidden min-h-0">
                <div class="flex justify-between items-center pl-1 shrink-0">
                    <h4 class="text-[10px] font-extrabold text-slate-500 uppercase tracking-widest">Buku Besar Pos Aktif 📖</h4>
                    <span class="text-[9px] text-indigo-300 font-black bg-indigo-950/40 px-2 py-0.5 rounded-md tracking-wide uppercase" id="lblSelectedPos">SEMUA</span>
                </div>
                
                <div class="flex-1 glass-card rounded-2xl p-3.5 shadow-sm overflow-y-auto no-scrollbar divide-y divide-slate-800/60 space-y-2.5 min-h-0 text-white" id="ledgerBox">
                    <div class="text-center py-6 text-xs text-slate-500 font-medium">Memuat mutasi kas...</div>
                </div>
            </div>

        </div>

        <nav id="bottomNavbar" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto h-16 glass-nav rounded-2xl shadow-xl flex justify-around items-center px-2 z-50 hidden">
            <button class="flex flex-col items-center justify-center space-y-1 w-11 h-11 text-indigo-400 cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[8px] font-black tracking-tight uppercase">Home</span>
            </button>
            <button class="flex flex-col items-center justify-center space-y-1 w-11 h-11 text-slate-600/50 cursor-not-allowed" disabled>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span class="text-[8px] font-black tracking-tight uppercase">Insight</span>
            </button>
            
            <div class="relative -top-4">
                <button onclick="openModalTx()" class="w-12 h-12 glass-fab text-slate-950 font-black rounded-full flex items-center justify-center text-xl active:scale-90 transition-all duration-150 border border-white/20 shadow-md cursor-pointer">
                    <span class="text-slate-950 font-black">+</span>
                </button>
            </div>

            <button class="flex flex-col items-center justify-center space-y-1 w-11 h-11 text-slate-600/50 cursor-not-allowed" disabled>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="text-[8px] font-black tracking-tight uppercase">Setting</span>
            </button>
            <button class="flex flex-col items-center justify-center space-y-1 w-11 h-11 text-slate-600/50 cursor-not-allowed" disabled>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[8px] font-black tracking-tight uppercase">Profil</span>
            </button>
        </nav>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwU-BDTK3uM54KBPvXJzaVVyB85wNFYU8j_LyGMoUfGz8u0kU7ASYIXq8i0EiMfIFBY/exec";
        
        let currentUser = null;
        let isPrivacyMode = false;
        let activePosIdGlobal = null;
        
        let mockPosData = [
            { ID_Pos: 'P001', Nama_Pos: 'Dompet Utama', Kategori: 'Utama', Pemilik: 'Bersama', Saldo_Saat_Ini: 4500000, Color_Class: 'card-blue' },
            { ID_Pos: 'P002', Nama_Pos: 'Tabungan Utama', Kategori: 'Utama', Pemilik: 'Bersama', Saldo_Saat_Ini: 12500000, Color_Class: 'card-green' },
            { ID_Pos: 'P003', Nama_Pos: 'Tabungan Anak', Kategori: 'Tabungan Anak', Pemilik: 'Anak', Saldo_Saat_Ini: 1500000, Color_Class: 'card-purple' },
            { ID_Pos: 'P004', Nama_Pos: 'Tabungan Haji', Kategori: 'Haji', Pemilik: 'Bersama', Saldo_Saat_Ini: 8000000, Color_Class: 'card-amber' },
            { ID_Pos: 'P005', Nama_Pos: 'Bisnis Telur Omega', Kategori: 'Bisnis', Pemilik: 'Bersama', Saldo_Saat_Ini: 3200000, Color_Class: 'card-teal' }
        ];
        
        let mockLedgerData = [
            { ID_Pos: 'P001', Tipe: 'Keluar', Ket: 'Beli Token Listrik Dompet', Vol: 200000, Time: '11 Jun 2026' },
            { ID_Pos: 'P001', Tipe: 'Masuk', Ket: 'Transfer Sisa Gaji Pokok', Vol: 4500000, Time: '10 Jun 2026' },
            { ID_Pos: 'P002', Tipe: 'Masuk', Ket: 'Alokasi Tabungan Bulanan', Vol: 2000000, Time: '08 Jun 2026' },
            { ID_Pos: 'P003', Tipe: 'Keluar', Ket: 'Pinjam Uang Anak keperluan Mendesak', Vol: 300000, Time: '05 Jun 2026' },
            { ID_Pos: 'P005', Tipe: 'Masuk', Ket: 'Omset Lunas Toko Kelontong B', Vol: 450000, Time: '11 Jun 2026' }
        ];

        function togglePrivacy() {
            isPrivacyMode = !isPrivacyMode;
            document.getElementById('eyeIcon').innerText = isPrivacyMode ? "🙈" : "👁️";
            renderTotalBalance();
            renderCarouselCards();
            refreshLedgerView();
        }

        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            const usr = document.getElementById('loginUsername').value.trim();
            executeAppLoginFlow(usr);
        });

        function executeAppLoginFlow(usr) {
            currentUser = { 
                nama: usr.toLowerCase() === 'anak' ? 'Anak' : (usr.charAt(0).toUpperCase() + usr.slice(1)), 
                role: usr.toLowerCase() === 'anak' ? 'Child' : 'Parent' 
            };

            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            document.getElementById('bottomNavbar').classList.remove('hidden');
            
            document.getElementById('userGreeting').innerText = "Halo, " + currentUser.nama;
            document.getElementById('userRole').innerText = currentUser.role;
            document.getElementById('userAvatar').innerText = currentUser.nama.charAt(0);

            if(currentUser.role === 'Child') {
                mockPosData = mockPosData.filter(p => p.Pemilik === 'Anak');
            }

            renderTotalBalance();
            renderCarouselCards();
            generateDots();
            handleVerticalScroll();
        }

        function renderTotalBalance() {
            if(isPrivacyMode) {
                document.getElementById('txtSisaUang').innerText = "Rp ••••••••";
                document.getElementById('txtRekomendasi').innerText = "🙈 Mode privasi aktif. Angka nominal terkunci.";
                return;
            }
            let total = mockPosData.reduce((acc, curr) => acc + curr.Saldo_Saat_Ini, 0);
            document.getElementById('txtSisaUang').innerText = "Rp " + total.toLocaleString('id-ID');
            document.getElementById('txtRekomendasi').innerText = "💡 Kondisi finansial sehat. Alokasi antar-pos seimbang mematuhi rasio kuota keluarga.";
        }

        function renderCarouselCards() {
            const container = document.getElementById('posCarousel');
            container.innerHTML = "";
            
            mockPosData.forEach(pos => {
                let displaySaldo = isPrivacyMode ? "Rp ••••" : "Rp " + pos.Saldo_Saat_Ini.toLocaleString('id-ID');
                let badgeColor = pos.Kategori === 'Bisnis' ? 'bg-emerald-600' : pos.Kategori === 'Haji' ? 'bg-amber-600' : 'bg-blue-600';
                
                let cardHtml = `
                    <div class="snap-center shrink-0 w-full h-32 glass-card ${pos.Color_Class} rounded-2xl p-4 shadow-sm flex flex-col justify-between box-border text-white">
                        <div class="flex justify-between items-start">
                            <div>
                                <h5 class="font-black text-sm tracking-tight text-white">${pos.Nama_Pos}</h5>
                                <p class="text-[9px] text-slate-400 font-bold mt-0.5">ID: ${pos.ID_Pos} • Owner: ${pos.Pemilik}</p>
                            </div>
                            <span class="text-[8px] text-white font-black px-2 py-0.5 rounded ${badgeColor} uppercase tracking-wider">${pos.Kategori}</span>
                        </div>
                        <div>
                            <span class="text-[9px] uppercase tracking-widest text-slate-400 font-extrabold block">Saldo Aktif</span>
                            <span class="text-lg font-black text-white">${displaySaldo}</span>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        function generateDots() {
            const dotsContainer = document.getElementById('carouselDots');
            dotsContainer.innerHTML = "";
            mockPosData.forEach((_, index) => {
                let dot = document.createElement('div');
                dot.id = `dot-${index}`;
                dot.className = "w-1 h-1 rounded-full bg-slate-800 transition-all duration-300";
                dotsContainer.appendChild(dot);
            });
        }

        function handleVerticalScroll() {
            const container = document.getElementById('posCarousel');
            if(!container.children.length) return;
            
            let cardHeight = container.children[0].offsetHeight + 10;
            let scrollTop = container.scrollTop;
            let activeIndex = Math.round(scrollTop / cardHeight);
            
            if(activeIndex >= mockPosData.length) activeIndex = mockPosData.length - 1;
            let activePos = mockPosData[activeIndex];

            // Update state titik indikator vertikal
            mockPosData.forEach((_, index) => {
                let dot = document.getElementById(`dot-${index}`);
                if(dot) {
                    if(index === activeIndex) {
                        dot.className = "w-1 h-3.5 rounded-full bg-indigo-400 transition-all duration-300 shadow-sm";
                    } else {
                        dot.className = "w-1 h-1 rounded-full bg-slate-700 transition-all duration-300";
                    }
                }
            });

            if (activePosIdGlobal !== activePos.ID_Pos) {
                activePosIdGlobal = activePos.ID_Pos;
                document.getElementById('lblSelectedPos').innerText = activePos.Nama_Pos.toUpperCase();
                
                const box = document.getElementById('ledgerBox');
                box.classList.remove('fade-in-ledger');
                void box.offsetWidth; 
                box.classList.add('fade-in-ledger');
                
                renderLedgerTable(activePos.ID_Pos);
            }
        }

        function refreshLedgerView() {
            if(activePosIdGlobal) renderLedgerTable(activePosIdGlobal);
        }

        function renderLedgerTable(posId) {
            const box = document.getElementById('ledgerBox');
            box.innerHTML = "";
            
            let filteredList = mockLedgerData.filter(l => l.ID_Pos === posId);
            
            if(filteredList.length === 0) {
                box.innerHTML = `
                    <div class="text-center py-8 text-xs text-slate-500 font-bold">
                        📭 Belum ada riwayat pergerakan kas di pos ini.
                    </div>
                `;
                return;
            }

            filteredList.forEach(log => {
                let isMasuk = log.Tipe === 'Masuk';
                let sign = isMasuk ? "+" : "-";
                let colorClass = isMasuk ? "text-emerald-400" : "text-rose-400";
                let icon = isMasuk ? "📥" : "💸";
                let nominal = isPrivacyMode ? "Rp •••" : "Rp " + log.Vol.toLocaleString('id-ID');

                let rowHtml = `
                    <div class="flex justify-between items-center py-2.5 text-xs text-white border-b border-slate-800/40 last:border-0">
                        <div class="flex items-center space-x-3 min-w-0">
                            <span class="text-base">${icon}</span>
                            <div class="min-w-0">
                                <p class="font-black text-white truncate">${log.Ket}</p>
                                <p class="text-[9px] text-slate-500 font-bold">${log.Time} • Auto Verified</p>
                            </div>
                        </div>
                        <div class="text-right shrink-0 font-black ${colorClass}">
                            ${sign} ${nominal}
                        </div>
                    </div>
                `;
                box.innerHTML += rowHtml;
            });
        }

        function openModalTx() {
            alert("Tombol '+' Premium Glassmorphism Berhasil Di-polish! Akses Popup Form Komplit (Multi-Tx, Warning Utang, & Upload SS) siap dilepas penuh pada eksekusi TAHAP 2.");
        }

        function logout() {
            currentUser = null;
            activePosIdGlobal = null;
            document.getElementById('mainDashboard').classList.add('hidden');
            document.getElementById('bottomNavbar').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('formLogin').reset();
        }

        // BLOCK INTERFERENSI IOS OVERSCROLL BOUNCING
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('#posCarousel') || e.target.closest('#ledgerBox')) {
                return;
            }
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
