<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Family Finance Super App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Penguncian dimensi PWA iOS - Mutlak Anti-Zoom & Anti-Geser Diagonal */
        html, body {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
            -webkit-overflow-scrolling: auto;
        }

        /* Pure Dark Glassmorphism Theme 2026 */
        .glass-card {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.5);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Variasi Rona Gradasi Kaca Berdasarkan Karakter Master Pos */
        .card-blue   { background: rgba(30, 58, 138, 0.25); border-left: 5px solid #3b82f6; box-shadow: inset 0 0 20px rgba(59, 130, 246, 0.1); }
        .card-green  { background: rgba(6, 78, 59, 0.25);   border-left: 5px solid #10b981; box-shadow: inset 0 0 20px rgba(16, 185, 129, 0.1); }
        .card-purple { background: rgba(88, 28, 135, 0.25);  border-left: 5px solid #a855f7; box-shadow: inset 0 0 20px rgba(168, 85, 247, 0.1); }
        .card-amber  { background: rgba(120, 53, 4, 0.25);   border-left: 5px solid #f59e0b; box-shadow: inset 0 0 20px rgba(245, 158, 11, 0.1); }
        .card-teal   { background: rgba(20, 83, 45, 0.25);   border-left: 5px solid #22c55e; box-shadow: inset 0 0 20px rgba(34, 197, 94, 0.1); }

        /* Dock Navigasi Bawah Kaca Tempa Gelap */
        .glass-nav {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        /* Modal Blur Latar Belakang */
        .modal-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(5, 8, 16, 0.8);
        }

        /* Custom Modern Glassmorphism FAB Button `+` dengan Efek Glow */
        .modern-fab {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.4), rgba(59, 130, 246, 0.4));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .fade-in-ledger {
            animation: fadeInSimple 0.25s ease-out forwards;
        }
        @keyframes fadeInSimple {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes orbit {
            0% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(20px, -20px) scale(1.03); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-bg-glow { animation: orbit 16s infinite alternate ease-in-out; }
    </style>
</head>
<body class="bg-[#090d16] text-slate-300 font-sans antialiased select-none flex justify-center items-center w-full h-full">

    <div class="absolute top-[-15%] left-[-15%] w-[100vw] h-[100vw] bg-indigo-950/40 rounded-full filter blur-[130px] animate-bg-glow z-0"></div>
    <div class="absolute bottom-[-15%] right-[-15%] w-[90vw] h-[90vw] bg-teal-950/25 rounded-full filter blur-[130px] animate-bg-glow z-0" style="animation-delay: 4s;"></div>

    <div class="relative z-10 w-full max-w-md h-full flex flex-col justify-between p-4 pt-5 pb-24 box-border overflow-hidden">
        
        <div id="loginScreen" class="w-full my-auto space-y-6">
            <div class="glass-card rounded-3xl p-6 text-center space-y-6 border border-slate-800/50">
                <div class="space-y-2">
                    <div class="inline-flex p-3.5 bg-gradient-to-tr from-indigo-500 to-blue-500 text-slate-950 font-black text-xl tracking-wider rounded-2xl shadow-lg">FF</div>
                    <h1 class="text-2xl font-black tracking-tight text-indigo-200">Family Finance</h1>
                    <p class="text-xs text-slate-400 font-bold">Platform FinTech Kolaborasi Keluarga</p>
                </div>

                <form id="formLogin" class="space-y-4 text-left">
                    <div class="space-y-1">
                        <label class="text-[10px] font-extrabold text-indigo-400 uppercase tracking-widest pl-1">Username</label>
                        <input type="text" id="loginUsername" class="w-full bg-[#0d1527]/60 rounded-2xl border border-slate-800 p-3.5 text-sm font-bold text-slate-200 focus:outline-none focus:border-indigo-500 transition shadow-inner" placeholder="Username Anda" required autocomplete="username">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-extrabold text-indigo-400 uppercase tracking-widest pl-1">Password</label>
                        <input type="password" id="loginPassword" class="w-full bg-[#0d1527]/60 rounded-2xl border border-slate-800 p-3.5 text-sm font-bold text-slate-200 focus:outline-none focus:border-indigo-500 transition shadow-inner" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-indigo-500 to-blue-500 text-slate-950 font-black rounded-2xl text-sm py-4 shadow-lg active:scale-[0.97] transition-all duration-150 mt-2 cursor-pointer">
                        Masuk Aplikasi
                    </button>
                </form>
            </div>
        </div>

        <div id="mainDashboard" class="w-full flex flex-col space-y-4 h-full overflow-hidden hidden">
            
            <div class="flex justify-between items-center glass-card rounded-2xl p-3 shrink-0">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-500 to-blue-500 text-slate-950 font-black text-sm flex items-center justify-center shadow-md" id="userAvatar">U</div>
                    <div>
                        <h2 class="text-xs font-black tracking-tight text-slate-200" id="userGreeting">Halo</h2>
                        <span class="text-[9px] bg-indigo-950/80 text-indigo-400 font-extrabold px-2 py-0.5 rounded-md uppercase tracking-wider block mt-0.5 w-max border border-indigo-900/50" id="userRole">Parent</span>
                    </div>
                </div>
                <button onclick="logout()" class="p-2.5 text-rose-400/80 hover:text-rose-400 hover:bg-rose-950/30 rounded-xl transition-all duration-200 cursor-pointer flex items-center justify-center border border-transparent active:scale-90">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                </button>
            </div>

            <div class="bg-gradient-to-br from-[#0c1220] via-[#111a30] to-[#080d1a] rounded-3xl p-4 shadow-2xl shrink-0 space-y-1.5 border border-slate-800/60 relative overflow-hidden">
                <div class="absolute right-[-5%] top-[-10%] w-24 h-24 bg-blue-500/5 rounded-full filter blur-xl"></div>
                <div class="flex items-center justify-between">
                    <p class="text-[9px] text-slate-400 uppercase font-bold tracking-widest flex items-center gap-1">
                        ✨ Total Saldo Gabungan Keluarga
                    </p>
                    <button onclick="togglePrivacy()" class="text-slate-400 hover:text-indigo-400 transition text-xs cursor-pointer p-1 active:scale-90">
                        <span id="eyeIcon">👁️</span>
                    </button>
                </div>
                <h3 class="text-2xl font-black tracking-wide text-emerald-300" id="txtSisaUang">Rp 0</h3>
                <p class="text-[10px] text-slate-400 bg-slate-900/40 border border-slate-800 p-2 rounded-xl font-medium" id="txtRekomendasi">Sistem siap.</p>
            </div>

            <div class="shrink-0 space-y-1.5 relative">
                <h4 class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest pl-1">Pos Keuangan Keluarga 💳</h4>
                <div class="relative w-full h-32 flex items-center">
                    <div class="w-full h-32 overflow-y-auto snap-y snap-mandatory no-scrollbar space-y-2.5 z-10" id="posCarousel" onscroll="handleVerticalScroll()"></div>
                    <div class="absolute right-[-14px] top-0 bottom-0 flex flex-col space-y-1.5 justify-center items-center w-3 z-20" id="carouselDots"></div>
                </div>
            </div>

            <div class="flex-1 flex flex-col space-y-1.5 overflow-hidden min-h-0">
                <div class="flex justify-between items-center pl-1 shrink-0">
                    <h4 class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest">Buku Besar Pos Aktif 📖</h4>
                    <span class="text-[9px] text-indigo-300 font-extrabold bg-indigo-950/50 border border-indigo-900/50 px-2 py-0.5 rounded-md tracking-wide uppercase" id="lblSelectedPos">SEMUA</span>
                </div>
                <div class="flex-1 glass-card rounded-2xl p-3.5 shadow-sm overflow-y-auto no-scrollbar divide-y divide-slate-800/40 space-y-2.5 min-h-0 text-slate-300" id="ledgerBox"></div>
            </div>

        </div>

        <div id="txModal" class="fixed inset-0 z-50 modal-blur flex items-end justify-center hidden">
            <div class="glass-card w-full max-w-md rounded-t-3xl p-5 space-y-4 max-h-[85vh] overflow-y-auto no-scrollbar border-t border-slate-700/50 box-border text-slate-300" id="txModalContent">
                
                <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                    <h3 class="text-sm font-black text-indigo-300 uppercase tracking-wider flex items-center gap-1.5">📝 Buat Transaksi Baru</h3>
                    <button onclick="closeModalTx()" class="p-2 text-slate-400 hover:text-slate-100 text-base font-bold cursor-pointer">✕</button>
                </div>

                <div class="space-y-3 text-xs">
                    <div class="space-y-1">
                        <label class="block font-bold text-slate-400">Tujuan Kategori Transaksi</label>
                        <select id="modalTxJenis" onchange="adaptifFormModal()" class="w-full bg-[#0d1527] rounded-xl border border-slate-800 p-3 font-bold text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="Pengeluaran">💸 Pengeluaran Rutin / Konsumsi</option>
                            <option value="Pemasukan">📥 Pemasukan (Gaji / Bisnis Telur)</option>
                            <option value="Transfer">🔄 Transfer / Pindah Uang Antar-Pos</option>
                            <option value="Pinjam">⚠️ Pinjam Uang (Hutang Anak / Ortu)</option>
                            <option value="BayarHutang">🤝 Bayar Hutang / Cicilan</option>
                        </select>
                    </div>

                    <div id="warningHutangIndicator" class="hidden bg-rose-950/50 border border-rose-900 text-rose-300 p-2.5 rounded-xl font-bold text-center tracking-wide animate-pulse">
                        🚨 INGAT! HUTANG HARUS DI-BAYAR DAN DI-CICIL!
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-slate-400 mb-1" id="lblSumberPos">Sumber Uang (Dari Pos)</label>
                            <select id="modalTxSumber" class="w-full bg-[#0d1527] rounded-xl border border-slate-800 p-2.5 font-bold text-slate-200 focus:outline-none"></select>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-400 mb-1" id="lblTujuanPos">Tujuan Uang (Ke Pos)</label>
                            <select id="modalTxTujuan" class="w-full bg-[#0d1527] rounded-xl border border-slate-800 p-2.5 font-bold text-slate-200 focus:outline-none"></select>
                        </div>
                    </div>

                    <div id="boxKomponenGaji" class="hidden space-y-1">
                        <label class="block font-bold text-slate-400">Komponen Pendapatan Gaji</label>
                        <input type="text" id="modalTxGaji" class="w-full bg-[#0d1527] rounded-xl border border-slate-800 p-2.5 text-slate-200" placeholder="Gaji Pokok / Tunjangan / Bonus">
                    </div>

                    <div class="space-y-1">
                        <label class="block font-bold text-slate-400">Keterangan Catatan</label>
                        <input type="text" id="modalTxKet" class="w-full bg-[#0d1527] rounded-xl border border-slate-800 p-2.5 text-slate-200 font-bold" placeholder="Misal: Beli Sembako / Pakan Ayam">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-slate-400 mb-1">Tag Kategori</label>
                            <input type="text" id="modalTxTag" class="w-full bg-[#0d1527] rounded-xl border border-slate-800 p-2.5 text-slate-200" placeholder="Sembako, Listrik, Pakan">
                        </div>
                        <div>
                            <label class="block font-bold text-slate-400 mb-1">Jumlah Nominal (Rp)</label>
                            <input type="number" id="modalTxJumlah" class="w-full bg-[#0d1527] rounded-xl border border-slate-800 p-2.5 text-emerald-300 font-black text-sm" placeholder="0">
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="block font-bold text-slate-400">Link URL Bukti SS Transfer / Dokumen</label>
                        <input type="url" id="modalTxBukti" class="w-full bg-[#0d1527] rounded-xl border border-slate-800 p-2.5 text-slate-400 text-[10px]" placeholder="https://drive.google.com/...">
                    </div>

                    <div class="pt-1">
                        <button type="button" onclick="tambahKeKeranjangTx()" class="w-full border border-dashed border-indigo-500/50 hover:border-indigo-400 text-indigo-400 font-bold py-2.5 rounded-xl active:scale-95 transition-transform cursor-pointer">
                            ➕ Tambah Pengeluaran Lain (Multi-Transaksi)
                        </button>
                    </div>

                    <div id="txBasketContainer" class="hidden bg-slate-900/50 border border-slate-800 rounded-xl p-2.5 space-y-1.5 max-h-24 overflow-y-auto no-scrollbar">
                        <p class="text-[9px] font-extrabold text-indigo-400 tracking-wider uppercase">🛒 Daftar Nota Multi-Transaksi:</p>
                        <div id="txBasketRows" class="divide-y divide-slate-800/60 space-y-1"></div>
                    </div>

                    <button onclick="prosesSubmitSuperTx()" class="w-full bg-gradient-to-r from-indigo-500 to-blue-500 text-slate-950 font-black py-4 rounded-xl shadow-lg text-sm tracking-wide active:scale-[0.97] transition-all mt-1 cursor-pointer">
                        🔒 Eksekusi & Simpan Masuk Spreadsheet
                    </button>
                </div>
            </div>
        </div>

        <nav id="bottomNavbar" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto h-16 glass-nav rounded-2xl shadow-2xl flex justify-around items-center px-2 z-50 hidden">
            <button class="flex flex-col items-center justify-center space-y-0.5 w-11 h-11 text-indigo-400 cursor-pointer">
                <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[8px] font-black tracking-tight uppercase text-indigo-400">Home</span>
            </button>
            <button class="flex flex-col items-center justify-center space-y-0.5 w-11 h-11 text-slate-500 opacity-40 cursor-not-allowed" disabled>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span class="text-[8px] font-black tracking-tight uppercase">Insight</span>
            </button>
            
            <div class="relative -top-4">
                <button onclick="openModalTx()" class="w-13 h-13 modern-fab rounded-full flex items-center justify-center shadow-lg cursor-pointer text-indigo-300 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </div>

            <button class="flex flex-col items-center justify-center space-y-0.5 w-11 h-11 text-slate-500 opacity-40 cursor-not-allowed" disabled>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="text-[8px] font-black tracking-tight uppercase">Setting</span>
            </button>
            <button class="flex flex-col items-center justify-center space-y-0.5 w-11 h-11 text-slate-500 opacity-40 cursor-not-allowed" disabled>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[8px] font-black tracking-tight uppercase">Profil</span>
            </button>
        </nav>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwU-BDTK3uM54KBPvXJzaVVyB85wNFYU8j_LyGMoUfGz8u0kU7ASYIXq8i0EiMfIFBY/exec";
        
        let currentUser = null;
        let isPrivacyMode = false;
        let activePosIdGlobal = null;
        let txKeranjangList = []; 
        
        let masterPosDinamis = [];
        let masterLedgerDinamis = [];

        function togglePrivacy() {
            isPrivacyMode = !isPrivacyMode;
            document.getElementById('eyeIcon').innerText = isPrivacyMode ? "🙈" : "👁️";
            renderTotalBalance();
            renderCarouselCards();
            refreshLedgerView();
        }

        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            const usr = document.getElementById('loginUsername').value.trim();
            const psw = document.getElementById('loginPassword').value;

            fetch(API_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'login', email: usr, password: psw })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    currentUser = data;
                    executeAppLoginFlow();
                } else {
                    alert("❌ Akses Ditolak: " + data.message);
                }
            })
            .catch(() => alert("🌐 Hubungan Terputus. Periksa jaringan internet Anda."));
        });

        function executeAppLoginFlow() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');
            document.getElementById('bottomNavbar').classList.remove('hidden');
            
            document.getElementById('userGreeting').innerText = "Halo, " + currentUser.nama;
            document.getElementById('userRole').innerText = currentUser.role;
            document.getElementById('userAvatar').innerText = currentUser.nama.charAt(0);

            tarikDataSheetsRealtime();
        }

        function tarikDataSheetsRealtime() {
            fetch(API_URL + "?action=get_dashboard")
            .then(res => res.json())
            .then(data => {
                const colors = ['card-blue', 'card-green', 'card-purple', 'card-amber', 'card-teal'];
                masterPosDinamis = data.pos.map((p, idx) => {
                    p.Saldo_Saat_Ini = Number(p.Saldo_Saat_Ini);
                    p.Color_Class = colors[idx % colors.length];
                    return p;
                });

                if(currentUser.role === 'Child') {
                    masterPosDinamis = masterPosDinamis.filter(p => p.Pemilik === 'Anak');
                }

                masterLedgerDinamis = data.ledger;
                
                renderTotalBalance();
                renderCarouselCards();
                generateDots();
                populateDropdownOptions();
                handleVerticalScroll();
            });
        }

        function renderTotalBalance() {
            if(isPrivacyMode) {
                document.getElementById('txtSisaUang').innerText = "Rp ••••••••";
                document.getElementById('txtRekomendasi').innerText = "🙈 Mode privat aktif. Angka saldo gabungan tersembunyi.";
                return;
            }
            let total = masterPosDinamis.reduce((acc, curr) => acc + curr.Saldo_Saat_Ini, 0);
            document.getElementById('txtSisaUang').innerText = "Rp " + total.toLocaleString('id-ID');
            document.getElementById('txtRekomendasi').innerText = "💡 Sinkronisasi data sukses. Alokasi antar-pos seimbang mematuhi rasio kuota ideal sekeluarga.";
        }

        function renderCarouselCards() {
            const container = document.getElementById('posCarousel');
            container.innerHTML = "";
            masterPosDinamis.forEach(pos => {
                let displaySaldo = isPrivacyMode ? "Rp ••••" : "Rp " + pos.Saldo_Saat_Ini.toLocaleString('id-ID');
                let badgeColor = pos.Kategori === 'Bisnis' ? 'text-emerald-400 bg-emerald-950/50 border border-emerald-900/30' : pos.Kategori === 'Haji' ? 'text-amber-400 bg-amber-950/50 border border-amber-900/30' : 'text-blue-400 bg-blue-950/50 border border-blue-900/30';
                
                container.innerHTML += `
                    <div class="snap-center shrink-0 w-full h-32 glass-card ${pos.Color_Class} rounded-2xl p-4 shadow-sm flex flex-col justify-between box-border text-slate-300">
                        <div class="flex justify-between items-start">
                            <div>
                                <h5 class="font-black text-sm tracking-tight text-slate-200">${pos.Nama_Pos}</h5>
                                <p class="text-[9px] text-slate-400 font-bold mt-0.5">ID: ${pos.ID_Pos} • Owner: ${pos.Pemilik}</p>
                            </div>
                            <span class="text-[8px] font-black px-2 py-0.5 rounded ${badgeColor} uppercase tracking-wider">${pos.Kategori}</span>
                        </div>
                        <div>
                            <span class="text-[9px] uppercase tracking-widest text-slate-400 font-extrabold block">Saldo Aktif</span>
                            <span class="text-lg font-black text-slate-100">${displaySaldo}</span>
                        </div>
                    </div>
                `;
            });
        }

        function generateDots() {
            const dotsContainer = document.getElementById('carouselDots');
            dotsContainer.innerHTML = "";
            masterPosDinamis.forEach((_, index) => {
                let dot = document.createElement('div');
                dot.id = `dot-${index}`;
                dot.className = "w-1 h-1 rounded-full bg-slate-800 transition-all duration-300";
                dotsContainer.appendChild(dot);
            });
        }

        function handleVerticalScroll() {
            const container = document.getElementById('posCarousel');
            if(!container || !container.children.length) return;
            
            let cardHeight = container.children[0].offsetHeight + 10;
            let scrollTop = container.scrollTop;
            let activeIndex = Math.round(scrollTop / cardHeight);
            
            if(activeIndex >= masterPosDinamis.length) activeIndex = masterPosDinamis.length - 1;
            let activePos = masterPosDinamis[activeIndex];

            masterPosDinamis.forEach((_, index) => {
                let dot = document.getElementById(`dot-${index}`);
                if(dot) {
                    dot.className = (index === activeIndex) 
                        ? "w-1 h-3.5 rounded-full bg-indigo-400 transition-all duration-300 shadow-sm shadow-indigo-500/50" 
                        : "w-1 h-1 rounded-full bg-slate-700 transition-all duration-300";
                }
            });

            if (activePosIdGlobal !== activePos.ID_Pos) {
                activePosIdGlobal = activePos.ID_Pos;
                document.getElementById('lblSelectedPos').innerText = activePos.Nama_Pos.toUpperCase();
                
                const box = document.getElementById('ledgerBox');
                box.classList.remove('fade-in-ledger');
                void box.offsetWidth; 
                box.classList.add('fade-in-ledger');
                
                renderLedgerTable(activePos.ID_Pos);
            }
        }

        function refreshLedgerView() {
            if(activePosIdGlobal) renderLedgerTable(activePosIdGlobal);
        }

        function renderLedgerTable(posId) {
            const box = document.getElementById('ledgerBox');
            box.innerHTML = "";
            
            let filteredList = masterLedgerDinamis.filter(l => l.ID_Pos === posId);
            if(filteredList.length === 0) {
                box.innerHTML = `<div class="text-center py-8 text-xs text-slate-500 font-bold">📭 Belum ada riwayat pergerakan kas di pos ini.</div>`;
                return;
            }

            filteredList.forEach(log => {
                let isMasuk = log.Tipe === 'Masuk';
                let sign = isMasuk ? "+" : "-";
                let colorClass = isMasuk ? "text-emerald-400" : "text-rose-400";
                let icon = isMasuk ? "📥" : "💸";
                let nominal = isPrivacyMode ? "Rp •••" : "Rp " + log.Vol.toLocaleString('id-ID');

                box.innerHTML += `
                    <div class="flex justify-between items-center py-2.5 text-xs text-slate-300 border-b border-slate-800/40 last:border-0">
                        <div class="flex items-center space-x-3 min-w-0">
                            <span class="text-base">${icon}</span>
                            <div class="min-w-0">
                                <p class="font-black text-slate-200 truncate">${log.Ket}</p>
                                <p class="text-[9px] text-slate-400 font-bold">${log.Time} • Auto Verified</p>
                            </div>
                        </div>
                        <div class="text-right shrink-0 font-black ${colorClass}">${sign} ${nominal}</div>
                    </div>
                `;
            });
        }

        // FIXED UNTUK AKSES SAFARI iOS INSTAN
        function openModalTx() {
            document.getElementById('txModal').classList.remove('hidden');
            populateDropdownOptions();
            adaptifFormModal();
        }

        function closeModalTx() {
            document.getElementById('txModal').classList.add('hidden');
            clearModalInputs();
        }

        function populateDropdownOptions() {
            const sumberSelect = document.getElementById('modalTxSumber');
            const tujuanSelect = document.getElementById('modalTxTujuan');
            
            sumberSelect.innerHTML = "";
            tujuanSelect.innerHTML = `<option value="">-- Pilih Pos Penerima --</option>`;
            
            masterPosDinamis.forEach(p => {
                sumberSelect.innerHTML += `<option value="${p.ID_Pos}">${p.Nama_Pos}</option>`;
                tujuanSelect.innerHTML += `<option value="${p.ID_Pos}">${p.Nama_Pos}</option>`;
            });
        }

        function adaptifFormModal() {
            const jenis = document.getElementById('modalTxJenis').value;
            const warningBox = document.getElementById('warningHutangIndicator');
            const boxGaji = document.getElementById('boxKomponenGaji');
            const selectSumber = document.getElementById('modalTxSumber');
            
            warningBox.classList.add('hidden');
            boxGaji.classList.add('hidden');
            document.getElementById('lblSumberPos').innerText = "Sumber Uang (Dari Pos)";
            document.getElementById('lblTujuanPos').innerText = "Tujuan Uang (Ke Pos)";

            if (jenis === "Pinjam") {
                warningBox.classList.remove('hidden');
                document.getElementById('lblSumberPos').innerText = "Pemberi Pinjaman (Pos Akun)";
                document.getElementById('lblTujuanPos').innerText = "Penerima Pinjaman (Pos Anda)";
            } 
            else if (jenis === "Pemasukan") {
                boxGaji.classList.remove('hidden');
                document.getElementById('lblSumberPos').innerText = "Asal Dana Eksternal";
                selectSumber.innerHTML = `<option value="EKSTERNAL">💼 Pihak Luar / Kantor / Pembeli</option>`;
            } 
            else if (jenis === "BayarHutang") {
                document.getElementById('lblSumberPos').innerText = "Pos Hutang yang Mau Dibayar";
                document.getElementById('lblTujuanPos').innerText = "Uang Pembayar (HANYA TABUNGAN)";
                
                const opsiTabunganSaja = masterPosDinamis.filter(p => p.Kategori === 'Utama' || p.Kategori === 'Tabungan Anak' || p.Kategori === 'Haji');
                const tujuanSelect = document.getElementById('modalTxTujuan');
                tujuanSelect.innerHTML = "";
                opsiTabunganSaja.forEach(p => {
                    tujuanSelect.innerHTML += `<option value="${p.ID_Pos}">${p.Nama_Pos}</option>`;
                });
            }
        }

        function tambahKeKeranjangTx() {
            const jenis = document.getElementById('modalTxJenis').value;
            const sumber = document.getElementById('modalTxSumber').value;
            const tujuan = document.getElementById('modalTxTujuan').value;
            const jumlah = document.getElementById('modalTxJumlah').value;
            const keterangan = document.getElementById('modalTxKet').value.trim();
            const tag = document.getElementById('modalTxTag').value.trim();
            const bukti = document.getElementById('modalTxBukti').value.trim();
            const gaji = document.getElementById('modalTxGaji').value.trim();

            if(!jumlah || !keterangan) {
                alert("Harap isi nominal harga dan keterangan terlebih dahulu.");
                return;
            }

            const itemTx = {
                jenis: jenis, sumber_pos: sumber, tujuan_pos: tujuan,
                jumlah: jumlah, keterangan: keterangan, tag_kategori: tag,
                bukti_transfer: bukti, komponen_gaji: gaji
            };

            txKeranjangList.push(itemTx);
            updateBasketVisualHtml();

            document.getElementById('modalTxJumlah').value = "";
            document.getElementById('modalTxKet').value = "";
            document.getElementById('modalTxTag').value = "";
            document.getElementById('modalTxBukti').value = "";
        }

        function updateBasketVisualHtml() {
            const container = document.getElementById('txBasketContainer');
            const rows = document.getElementById('txBasketRows');
            
            if(txKeranjangList.length === 0) {
                container.classList.add('hidden');
                return;
            }
            
            container.classList.remove('hidden');
            rows.innerHTML = "";
            
            txKeranjangList.forEach((item, index) => {
                rows.innerHTML += `
                    <div class="flex justify-between items-center text-[10px] text-slate-400 py-1">
                        <span class="truncate max-w-[240px]">🛒 ${item.keterangan}</span>
                        <div class="flex items-center space-x-2">
                            <span class="font-bold text-emerald-400">Rp ${Number(item.jumlah).toLocaleString('id-ID')}</span>
                            <button onclick="hapusItemBasket(${index})" class="text-rose-400 font-bold px-1">✕</button>
                        </div>
                    </div>
                `;
            });
        }

        function hapusItemBasket(idx) {
            txKeranjangList.splice(idx, 1);
            updateBasketVisualHtml();
        }

        function prosesSubmitSuperTx() {
            if (txKeranjangList.length === 0) {
                tambahKeKeranjangTx();
            }

            console.log("Mengirim paket data transaksi simultan ke Google Sheets...");
            
            let barisSukses = 0;
            txKeranjangList.forEach(txItem => {
                txItem.action = "add_transaksi";
                txItem.tanggal = new Date().toISOString().split('T')[0];
                txItem.dibuat_oleh = currentUser.username;

                fetch(API_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(txItem)
                })
                .then(res => res.json())
                .then(data => {
                    if(data.status === 'success') {
                        barisSukses++;
                        if(barisSukses === txKeranjangList.length) {
                            alert("🎉 Sukses! Seluruh nota transaksi berhasil dicatat di Spreadsheet.");
                            txKeranjangList = [];
                            updateBasketVisualHtml();
                            closeModalTx();
                            tarikDataSheetsRealtime(); 
                        }
                    }
                });
            });
        }

        function clearModalInputs() {
            document.getElementById('modalTxJumlah').value = "";
            document.getElementById('modalTxKet').value = "";
            document.getElementById('modalTxTag').value = "";
            document.getElementById('modalTxBukti').value = "";
            document.getElementById('modalTxGaji').value = "";
            txKeranjangList = [];
            updateBasketVisualHtml();
        }

        function logout() {
            currentUser = null;
            activePosIdGlobal = null;
            document.getElementById('mainDashboard').classList.add('hidden');
            document.getElementById('bottomNavbar').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('formLogin').reset();
        }

        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('#posCarousel') || e.target.closest('#ledgerBox') || e.target.closest('#txModalContent')) {
                return;
            }
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
